<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rackagentur — Projects</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a26;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f8;
      --text-muted: #8888aa;
      --accent: #176bff;
      --accent-glow: rgba(23,107,255,0.15);
      --badge-live: rgba(34,197,94,0.15);
      --badge-live-text: #22c55e;
      --badge-dev: rgba(234,179,8,0.15);
      --badge-dev-text: #eab308;
      --badge-concept: rgba(139,92,246,0.12);
      --badge-concept-text: #a78bfa;
      --badge-tool: rgba(6,182,212,0.12);
      --badge-tool-text: #22d3ee;
      --radar-opacity: 0.07;
      --sweep-opacity: 0.85;
    }
    :root[data-theme="light"] {
      --bg: #f2f4f8;
      --surface: #ffffff;
      --surface2: #eef0f6;
      --border: rgba(0,0,0,0.08);
      --text: #0a0a14;
      --text-muted: #5a5a7a;
      --accent: #0f5ce8;
      --accent-glow: rgba(15,92,232,0.08);
      --badge-live: rgba(22,163,74,0.12);
      --badge-live-text: #15803d;
      --badge-dev: rgba(202,138,4,0.15);
      --badge-dev-text: #854d0e;
      --badge-concept: rgba(109,40,217,0.10);
      --badge-concept-text: #7c3aed;
      --badge-tool: rgba(8,145,178,0.10);
      --badge-tool-text: #0e7490;
      --radar-opacity: 0.10;
      --sweep-opacity: 0.55;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Radar background ── */
    .radar-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .radar-bg svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: var(--radar-opacity);
    }
    .radar-sweep {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 900px;
      height: 900px;
      margin-left: -450px;
      margin-top: -450px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 75%, rgba(23,107,255,0.18) 100%);
      transform-origin: center;
      animation: sweep 5s linear infinite;
      opacity: var(--sweep-opacity);
    }
    @keyframes sweep { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 56px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      transition: color 0.2s, border-color 0.2s;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding-left: 2px;
    }

    /* ── Card grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
      margin-bottom: 44px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: var(--accent-glow);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .card:hover { border-color: rgba(23,107,255,0.5); }
    .card:hover::before { opacity: 1; }

    /* ── App icon ── */
    .app-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, #176bff, #0d44b5);
      box-shadow: 0 4px 14px rgba(23,107,255,0.3);
    }
    .icon-purple { background: linear-gradient(135deg, #7c3aed, #4c1d95); box-shadow: 0 4px 14px rgba(124,58,237,0.3); }
    .icon-cyan   { background: linear-gradient(135deg, #0891b2, #164e63); box-shadow: 0 4px 14px rgba(8,145,178,0.3); }
    .icon-green  { background: linear-gradient(135deg, #16a34a, #14532d); box-shadow: 0 4px 14px rgba(22,163,74,0.3); }
    .icon-orange { background: linear-gradient(135deg, #ea580c, #7c2d12); box-shadow: 0 4px 14px rgba(234,88,12,0.3); }
    .icon-pink   { background: linear-gradient(135deg, #db2777, #831843); box-shadow: 0 4px 14px rgba(219,39,119,0.3); }
    .icon-teal   { background: linear-gradient(135deg, #0d9488, #134e4a); box-shadow: 0 4px 14px rgba(13,148,136,0.3); }
    .icon-indigo { background: linear-gradient(135deg, #4338ca, #1e1b4b); box-shadow: 0 4px 14px rgba(67,56,202,0.3); }
    .icon-sky    { background: linear-gradient(135deg, #0284c7, #0c4a6e); box-shadow: 0 4px 14px rgba(2,132,199,0.3); }
    .icon-amber  { background: linear-gradient(135deg, #d97706, #78350f); box-shadow: 0 4px 14px rgba(217,119,6,0.3); }
    .icon-emerald{ background: linear-gradient(135deg, #059669, #064e3b); box-shadow: 0 4px 14px rgba(5,150,105,0.3); }
    /* Real logo icons — no gradient, no font-size needed */
    .icon-logo { background: none; box-shadow: none; padding: 0; overflow: hidden; }
    .icon-logo-contrast { background: #111118; }
    .icon-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; display: block; }

    /* ── Card body ── */
    .card-body { flex: 1; min-width: 0; }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .card-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 100px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-live    { background: var(--badge-live);    color: var(--badge-live-text); }
    .badge-dev     { background: var(--badge-dev);     color: var(--badge-dev-text); }
    .badge-concept { background: var(--badge-concept); color: var(--badge-concept-text); }
    .badge-tool    { background: var(--badge-tool);    color: var(--badge-tool-text); }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .stack-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .stack-tag {
      font-size: 10px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px;
    }

    .card-links {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 9px;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s;
    }
    .link-btn:hover { color: var(--accent); border-color: var(--accent); }

    .audit-note { font-size: 12px; line-height: 1.6; color: var(--text-muted); margin: -26px 0 32px; }
    .project-meta { font-size: 11px; color: var(--text-muted); line-height: 1.55; margin: 7px 0 11px; }
    .project-meta strong { color: var(--text); font-weight: 600; }
    .section-count { font-size: 11px; font-weight: 400; letter-spacing: normal; text-transform: none; }
    .badge-unknown { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
    .audit-error { color: var(--badge-dev-text); font-size: 13px; margin-bottom: 30px; }

    /* ── Footer ── */
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .radar-sweep { animation: none; }
      *, *::before, *::after { transition: none !important; }
    }

    @media (max-width: 600px) {
      .page { padding: 28px 16px 60px; }
      .grid { grid-template-columns: 1fr; }
      header { margin-bottom: 36px; }
    }
  </style>
</head>
<body>

<div class="radar-bg" aria-hidden="true">
  <svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
    <circle cx="400" cy="400" r="80"  fill="none" stroke="#176bff" stroke-width="1"/>
    <circle cx="400" cy="400" r="160" fill="none" stroke="#176bff" stroke-width="1"/>
    <circle cx="400" cy="400" r="240" fill="none" stroke="#176bff" stroke-width="1"/>
    <circle cx="400" cy="400" r="320" fill="none" stroke="#176bff" stroke-width="1"/>
    <circle cx="400" cy="400" r="400" fill="none" stroke="#176bff" stroke-width="1"/>
    <circle cx="400" cy="400" r="560" fill="none" stroke="#176bff" stroke-width="0.5"/>
    <line x1="400" y1="0"   x2="400" y2="800" stroke="#176bff" stroke-width="0.8"/>
    <line x1="0"   y1="400" x2="800" y2="400" stroke="#176bff" stroke-width="0.8"/>
    <line x1="0"   y1="0"   x2="800" y2="800" stroke="#176bff" stroke-width="0.4"/>
    <line x1="800" y1="0"   x2="0"   y2="800" stroke="#176bff" stroke-width="0.4"/>
  </svg>
  <div class="radar-sweep"></div>
</div>

<div class="page">

  <header>
    <div class="brand">
      <div class="brand-icon">RA</div>
      <div>
        <h1 class="brand-name">Rackagentur</h1>
        <div class="brand-sub">Gregory Rack &mdash; All Projects</div>
      </div>
    </div>
    <button class="theme-btn" type="button" aria-label="Switch to light theme" onclick="toggleTheme()">☀ / ☾</button>
  </header>

  <main>
  <p class="audit-note">Portfolio inventory checked <span id="verified-on">—</span>. Development status and deployment health are tracked separately; unverified links are not presented as confirmed live.</p>
  <div id="portfolio" aria-live="polite">
    <p class="card-desc">Loading project registry…</p>
  </div>

  </main>

  <footer>
    <p>Rackagentur &mdash; Gregory Rack &mdash; Cologne &mdash; 2026</p>
  </footer>

</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
    updateThemeLabel();
    try { localStorage.setItem('ra-theme', html.dataset.theme); } catch {}
  }
  function updateThemeLabel() {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.querySelector('.theme-btn').setAttribute('aria-label', 'Switch to ' + next + ' theme');
  }
  try {
    const saved = localStorage.getItem('ra-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
  } catch {}
  updateThemeLabel();

  const images = {
    'NoxReach': 'assets/noxreach.svg',
    'Standby Radar': 'assets/standby-radar.png',
    'Sound of GEEZ': 'assets/geez.png',
    'NoxReach Prompt Generator': 'assets/noxreach-prompt-gen.svg',
    'NoxReach Scheduler': 'assets/noxreach-scheduler.svg',
    'NoxReach Motion': 'assets/noxreach-motion.svg',
    'FilterStay': 'assets/filterstay.png',
    'Groundwork': 'assets/groundwork.png'
  };
  const icons = {
    'SkyCheck': '🛫', 'LayoverAI': '🗺', 'Packpilot': '🧳',
    'Bitescan': '🍽', 'FOUND': '📍', 'Flight Control': '✈',
    'GEEZ Social': '📱', 'Big Brother GEEZ': '🏠', 'Order of the Keeper': '◈'
  };
  const groups = [
    ['Live', p => p.development_status === 'Live' || p.development_status === 'Maintenance'],
    ['In Development', p => p.development_status === 'Development' || p.development_status === 'Testing'],
    ['Needs Verification', p => p.development_status === 'Unverified'],
    ['Concepts & Explorations', p => p.development_status === 'Concept'],
    ['Paused & Archived', p => p.development_status === 'Paused' || p.development_status === 'Archived']
  ];

  function node(tag, className, value) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (value !== undefined) el.textContent = value;
    return el;
  }
  function makeLink(label, href, project) {
    const a = node('a', 'link-btn', label);
    a.setAttribute('aria-label', project + ': ' + label + ' (opens in a new tab)');
    a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }
  function makeCard(p) {
    const card = node('article', 'card');
    const icon = node('div', 'app-icon' + (images[p.name] ? ' icon-logo' : ''));
    icon.setAttribute('aria-hidden', 'true');
    if (p.name === 'Sound of GEEZ') icon.classList.add('icon-logo-contrast');
    if (images[p.name]) {
      const img = document.createElement('img');
      img.src = images[p.name]; img.alt = '';
      icon.appendChild(img);
    } else icon.textContent = icons[p.name] || '◆';
    card.appendChild(icon);

    const body = node('div', 'card-body');
    const top = node('div', 'card-top');
    top.appendChild(node('h3', 'card-name', p.name));
    const status = p.development_status || 'Unverified';
    const badgeClass = status === 'Live' || status === 'Maintenance' ? 'badge-live' :
      status === 'Development' || status === 'Testing' ? 'badge-dev' :
      status === 'Concept' ? 'badge-concept' : 'badge-unknown';
    top.appendChild(node('span', 'badge ' + badgeClass, status));
    body.appendChild(top);
    const tags = node('div', 'stack-tags');
    (p.stack || '').split(' · ').filter(Boolean).forEach(t => tags.appendChild(node('span', 'stack-tag', t)));
    body.appendChild(tags);
    body.appendChild(node('p', 'card-desc', p.description));

    const meta = node('div', 'project-meta');
    const deployment = node('p', '', 'Deployment: ' + (p.deployment_status || 'Unknown'));
    meta.appendChild(deployment);
    const step = node('p');
    step.appendChild(node('strong', '', 'Next: '));
    step.appendChild(document.createTextNode(p.next_step || 'Not established'));
    meta.appendChild(step);
    meta.appendChild(node('p', '', 'Checked: ' + (p.last_verified || 'Not verified')));
    if (p.blockers && p.blockers.length) meta.appendChild(node('p', '', 'Blocker: ' + p.blockers.join('; ')));
    body.appendChild(meta);

    const links = node('div', 'card-links');
    if (p.repository) links.appendChild(makeLink('GitHub', p.repository, p.name));
    if (p.production_url) links.appendChild(makeLink('Listed URL (unverified)', p.production_url, p.name));
    body.appendChild(links);
    card.appendChild(body);
    return card;
  }

  async function loadProjects() {
    const container = document.getElementById('portfolio');
    try {
      const res = await fetch('./projects.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const registry = await res.json();
      if (!Array.isArray(registry.projects)) throw new Error('Invalid registry');
      document.getElementById('verified-on').textContent = registry.verified_on || 'not established';
      container.replaceChildren();
      for (const [label, predicate] of groups) {
        const projects = registry.projects.filter(predicate);
        if (!projects.length) continue;
        const heading = node('h2', 'section-label', label + ' · ' + projects.length);
        const grid = node('div', 'grid');
        projects.forEach(project => grid.appendChild(makeCard(project)));
        container.appendChild(heading);
        container.appendChild(grid);
      }
    } catch (error) {
      container.replaceChildren(node('p', 'audit-error', 'Project registry unavailable. Open this dashboard through its hosted site or a local web server. ' + error.message));
    }
  }
  loadProjects();
</script>

</body>
</html>
